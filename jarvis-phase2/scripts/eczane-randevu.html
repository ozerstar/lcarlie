<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>L’CARLIÉ · Ziyaret randevusu</title>
<style>
  :root { --teal:#155761; --ink:#303638; --muted:#6b7173; --ivory:#f7f4ee; --line:#e3ddd2; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--ivory); color:var(--ink); font-family: Arial, Helvetica, sans-serif; }
  header { background:var(--teal); padding:18px; text-align:center; }
  header img { width:150px; height:auto; }
  main { max-width:620px; margin:0 auto; padding:22px 16px 48px; }
  h1 { color:var(--teal); font-size:23px; line-height:1.3; margin:6px 0 8px; }
  .alt { color:var(--muted); font-size:15px; line-height:1.55; margin:0 0 20px; }
  .kart { background:#fff; border:1px solid var(--line); border-radius:12px; padding:18px; margin-bottom:16px; }
  h2 { font-size:17px; color:var(--teal); margin:0 0 12px; }
  .gunler { display:flex; gap:8px; overflow-x:auto; padding-bottom:6px; }
  .gun { flex:0 0 auto; border:1px solid var(--line); background:#fff; border-radius:10px; padding:9px 12px; font-size:14px; cursor:pointer; text-align:center; min-width:74px; }
  .gun b { display:block; font-size:16px; }
  .gun.secili, .saat.secili { background:var(--teal); color:#fff; border-color:var(--teal); }
  .saatler { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px,1fr)); gap:8px; margin-top:12px; }
  .saat { border:1px solid var(--line); background:#fff; border-radius:8px; padding:10px 0; font-size:15px; cursor:pointer; }
  label { display:block; font-size:14px; margin:12px 0 6px; font-weight:bold; }
  input[type=text], input[type=tel], select, textarea { width:100%; border:1px solid var(--line); border-radius:8px; padding:11px; font-size:16px; font-family:inherit; background:#fff; }
  textarea { min-height:70px; }
  .ilgi { display:flex; flex-wrap:wrap; gap:8px; }
  .ilgi label { font-weight:normal; margin:0; border:1px solid var(--line); border-radius:999px; padding:7px 12px; background:#fff; font-size:14px; }
  .bal { position:absolute; left:-9999px; }
  button.gonder { width:100%; background:var(--teal); color:#fff; border:0; border-radius:10px; padding:15px; font-size:17px; font-weight:bold; margin-top:16px; cursor:pointer; }
  button.gonder:disabled { opacity:.55; }
  .hata { color:#b3261e; font-size:15px; margin-top:10px; }
  .tamam { text-align:center; padding:30px 10px; }
  .tamam h1 { font-size:24px; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 16px 30px; }
</style>
</head>
<body>
<header><img src="/urun-gorsel/eczane-mail/lcarlie-logo-beyaz.png" alt="L’CARLIÉ"></header>
<main id="ana">
  <p class="alt">Yükleniyor…</p>
</main>
<footer>Lemos Medikal · Yenimahalle / Ankara · info@lcarlie.com.tr · 0544 544 21 15</footer>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '';
  var ana = document.getElementById('ana');
  var GUN = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
  var AY = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  var veri, gunSec = 0, saatSec = null;
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function saatYaz(iso) { return iso.slice(11, 16); }
  function gunYaz(iso) { var d = new Date(iso + 'T12:00:00'); return GUN[d.getDay()] + '<b>' + d.getDate() + '</b>' + AY[d.getMonth()]; }
  function uzunYaz(iso) { var d = new Date(iso); return d.getDate() + ' ' + AY[d.getMonth()] + ' ' + GUN[d.getDay()] + ', ' + saatYaz(iso); }

  function ciz() {
    var g = veri.gunler[gunSec] || { saatler: [] };
    ana.innerHTML =
      '<h1>' + esc(veri.eczane) + ' için tanışma ziyareti</h1>' +
      '<p class="alt">Yaklaşık 15 dakikalık kısa bir ziyaret: ürünleri elinizde inceleyebilir, eczane koşullarını konuşabiliriz. Yalnızca boş saatler görünür; seçtiğiniz saat yalnızca size ayrılır.</p>' +
      '<div class="kart"><h2>1 · Gün ve saat</h2><div class="gunler">' +
      veri.gunler.map(function (x, i) { return '<button type="button" class="gun' + (i === gunSec ? ' secili' : '') + '" data-g="' + i + '">' + gunYaz(x.gun) + '</button>'; }).join('') +
      '</div><div class="saatler">' +
      g.saatler.map(function (s) { return '<button type="button" class="saat' + (s === saatSec ? ' secili' : '') + '" data-s="' + s + '">' + saatYaz(s) + '</button>'; }).join('') +
      '</div></div>' +
      '<form class="kart" id="f"><h2>2 · Sizi kim karşılayacak?</h2>' +
      '<label for="y">Yetkili adı soyadı *</label><input id="y" type="text" required autocomplete="name">' +
      '<label for="u">Görevi</label><select id="u"><option>Eczacı (eczane sahibi)</option><option>Mesul müdür</option><option>Yardımcı eczacı</option><option>Eczane teknikeri</option></select>' +
      '<label for="p">Telefon *</label><input id="p" type="tel" required placeholder="05xx xxx xx xx" autocomplete="tel">' +
      '<label>İlgilendiğiniz ürün grupları</label><div class="ilgi">' +
      ['Yüz bakımı', 'Güneş koruma', 'Vücut bakımı', 'Bebek bakımı', 'Ağız bakımı', 'Erkek bakımı'].map(function (x) { return '<label><input type="checkbox" value="' + x + '"> ' + x + '</label>'; }).join('') +
      '</div><label for="n">Eklemek istedikleriniz</label><textarea id="n" maxlength="500"></textarea>' +
      '<input class="bal" id="w" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<button class="gonder" id="b" type="submit"' + (saatSec ? '' : ' disabled') + '>' + (saatSec ? esc(uzunYaz(saatSec)) + ' için randevu iste' : 'Önce bir saat seçin') + '</button>' +
      '<div class="hata" id="h"></div></form>';
    ana.querySelectorAll('.gun').forEach(function (b) { b.onclick = function () { gunSec = +b.dataset.g; saatSec = null; ciz(); }; });
    ana.querySelectorAll('.saat').forEach(function (b) { b.onclick = function () { saatSec = b.dataset.s; ciz(); }; });
    document.getElementById('f').onsubmit = gonder;
  }

  function gonder(e) {
    e.preventDefault();
    var b = document.getElementById('b'), h = document.getElementById('h');
    b.disabled = true; h.textContent = '';
    var ilgi = [].slice.call(ana.querySelectorAll('.ilgi input:checked')).map(function (x) { return x.value; });
    fetch('/randevu/api/al', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: t, saat: saatSec, yetkili: document.getElementById('y').value,
        unvan: document.getElementById('u').value, telefon: document.getElementById('p').value,
        ilgi: ilgi, not: document.getElementById('n').value, web_sitesi: document.getElementById('w').value }) })
      .then(function (r) { return r.json().then(function (j) { return [r.status, j]; }); })
      .then(function (x) {
        if (x[0] === 200 && x[1].tamam) {
          ana.innerHTML = '<div class="kart tamam"><h1>Randevu talebiniz alındı</h1><p class="alt">' + esc(uzunYaz(saatSec)) +
            ' · ' + esc(veri.eczane) + '</p><p class="alt">Ekibimiz ziyaretten önce sizi arayarak teyit edecek. Teşekkür ederiz.</p></div>';
        } else {
          h.textContent = (x[1] && x[1].hata) || 'Bir sorun oluştu, lütfen tekrar deneyin.';
          if (x[0] === 409) { yukle(); } else { b.disabled = false; }
        }
      })
      .catch(function () { h.textContent = 'Bağlantı sorunu. Lütfen tekrar deneyin.'; b.disabled = false; });
  }

  function yukle() {
    fetch('/randevu/api/bos?t=' + encodeURIComponent(t))
      .then(function (r) { return r.json().then(function (j) { return [r.status, j]; }); })
      .then(function (x) {
        if (x[0] !== 200) { ana.innerHTML = '<div class="kart tamam"><h1>Bağlantı geçersiz</h1><p class="alt">Randevu için 0544 544 21 15 numarasından bize ulaşabilirsiniz.</p></div>'; return; }
        veri = x[1];
        if (veri.mevcut) {
          ana.innerHTML = '<div class="kart tamam"><h1>Randevunuz var</h1><p class="alt">' + esc(uzunYaz(veri.mevcut.baslangic)) + ' · ' + esc(veri.eczane) +
            '</p><p class="alt">Değişiklik için 0544 544 21 15 numarasından bize ulaşabilirsiniz.</p></div>'; return;
        }
        saatSec = null; gunSec = 0; ciz();
      })
      .catch(function () { ana.innerHTML = '<p class="alt">Bağlantı sorunu. Lütfen sayfayı yenileyin.</p>'; });
  }
  yukle();
})();
</script>
</body>
</html>
