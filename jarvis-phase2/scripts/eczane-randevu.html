<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#155761">
<title>L’CARLIÉ · Ziyaret randevusu</title>
<style>
  :root {
    --teal:#155761; --teal2:#1f7a86; --mint:#e3f2ef; --ink:#2b3133; --muted:#667073;
    --ivory:#f8f5ef; --line:#e6dfd3; --gold:#c8a25a; --rose:#f6e4e1; --sky:#e3eef8;
    --sun:#fbf0d6; --leaf:#e4f1de; --lilac:#ece6f5;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--ivory); color:var(--ink); font-family:"Segoe UI",Arial,Helvetica,sans-serif; }
  .ust { background:linear-gradient(135deg,#0f4851 0%,var(--teal) 55%,var(--teal2) 100%); padding:16px; text-align:center; }
  .ust img { width:140px; height:auto; display:block; margin:0 auto; }
  .kahraman { position:relative; max-width:720px; margin:0 auto; }
  .kahraman img { width:100%; height:230px; object-fit:cover; display:block; }
  .kahraman .ortu { position:absolute; inset:0; background:linear-gradient(180deg,rgba(15,72,81,0) 35%,rgba(15,72,81,.88) 100%); }
  .kahraman .yazi { position:absolute; left:18px; right:18px; bottom:16px; color:#fff; }
  .kahraman .etiket { display:inline-block; background:var(--gold); color:#2b2412; font-size:12px; font-weight:700; letter-spacing:1px; padding:4px 10px; border-radius:999px; }
  .kahraman h1 { margin:8px 0 0; font-size:23px; line-height:1.25; text-shadow:0 1px 6px rgba(0,0,0,.35); }
  main { max-width:720px; margin:0 auto; padding:18px 16px 40px; }
  .giris { background:#fff; border:1px solid var(--line); border-radius:16px; padding:16px 18px; margin-top:-6px; box-shadow:0 6px 20px rgba(21,87,97,.08); }
  .giris p { margin:0 0 10px; font-size:15px; line-height:1.6; color:var(--muted); }
  .giris b { color:var(--ink); }
  .gruplar { display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .grup { font-size:12.5px; padding:5px 10px; border-radius:999px; color:#2b3133; }
  .g1{background:var(--mint)} .g2{background:var(--rose)} .g3{background:var(--sky)} .g4{background:var(--sun)}
  .g5{background:var(--leaf)} .g6{background:var(--lilac)} .g7{background:#fde7d3} .g8{background:#e6ecef}
  .urunler { margin:16px 0 4px; border-radius:14px; overflow:hidden; border:1px solid var(--line); background:#fff; }
  .urunler img { width:100%; display:block; }
  .adimlar { display:flex; gap:8px; margin:18px 0 12px; }
  .adim { flex:1; display:flex; align-items:center; gap:8px; background:#fff; border:1px solid var(--line); border-radius:12px; padding:9px 10px; font-size:13px; color:var(--muted); }
  .adim i { font-style:normal; width:26px; height:26px; flex:0 0 26px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:700; color:#fff; background:#b8c4c6; }
  .adim.aktif { border-color:var(--teal); color:var(--teal); font-weight:600; }
  .adim.aktif i, .adim.bitti i { background:var(--teal); }
  .kart { background:#fff; border:1px solid var(--line); border-radius:16px; padding:18px; margin-bottom:16px; box-shadow:0 4px 14px rgba(21,87,97,.05); }
  h2 { font-size:17px; color:var(--teal); margin:0 0 4px; display:flex; align-items:center; gap:8px; }
  .alt { color:var(--muted); font-size:13.5px; margin:0 0 12px; line-height:1.5; }
  .gunler { display:flex; gap:8px; overflow-x:auto; padding:2px 2px 8px; scroll-snap-type:x mandatory; }
  .gun { flex:0 0 auto; scroll-snap-align:start; border:1.5px solid var(--line); background:#fff; border-radius:14px; padding:9px 12px; font-size:13px; cursor:pointer; text-align:center; min-width:72px; color:var(--muted); transition:.15s; }
  .gun b { display:block; font-size:20px; color:var(--ink); line-height:1.2; }
  .gun:hover { border-color:var(--teal2); }
  .gun .nokta { display:block; height:6px; margin-top:5px; }
  .gun .nokta.var::after { content:""; display:inline-block; width:6px; height:6px; border-radius:50%; background:#2e9e6a; }
  .gun.secili { background:linear-gradient(160deg,var(--teal),var(--teal2)); border-color:var(--teal); color:#d7ecef; box-shadow:0 6px 14px rgba(21,87,97,.25); }
  .gun.secili b { color:#fff; }
  .saatler { display:grid; grid-template-columns:repeat(auto-fill,minmax(96px,1fr)); gap:8px; margin-top:12px; }
  .saat { position:relative; border:1.5px solid var(--line); background:var(--ivory); border-radius:12px; padding:12px 0 10px; font-size:16px; font-weight:600; color:var(--ink); cursor:pointer; transition:.15s; }
  .saat small { display:block; font-size:11px; font-weight:500; color:var(--muted); margin-top:2px; }
  .saat:hover { border-color:var(--teal2); background:#fff; }
  .saat.yakin { background:#eaf6ef; border-color:#9fd3b5; }
  .saat.yakin small { color:#23784e; }
  .saat.secili { background:linear-gradient(160deg,var(--teal),var(--teal2)); border-color:var(--teal); color:#fff; }
  .saat.secili small { color:#cfe7ea; }
  .bilgi { display:flex; gap:8px; align-items:flex-start; background:var(--sun); border-radius:10px; padding:9px 11px; font-size:12.5px; color:#6b5520; margin-top:12px; line-height:1.45; }
  label { display:block; font-size:14px; margin:14px 0 6px; font-weight:600; }
  input[type=text], input[type=tel], select, textarea { width:100%; border:1.5px solid var(--line); border-radius:10px; padding:12px; font-size:16px; font-family:inherit; background:#fff; color:var(--ink); }
  input:focus, select:focus, textarea:focus { outline:none; border-color:var(--teal2); box-shadow:0 0 0 3px rgba(31,122,134,.15); }
  textarea { min-height:74px; resize:vertical; }
  .ilgi { display:flex; flex-wrap:wrap; gap:8px; }
  .ilgi label { font-weight:500; margin:0; border:1.5px solid var(--line); border-radius:999px; padding:7px 12px; background:#fff; font-size:13.5px; cursor:pointer; }
  .ilgi label:has(input:checked) { background:var(--mint); border-color:var(--teal2); color:var(--teal); }
  .ilgi input { accent-color:var(--teal); }
  .bal { position:absolute; left:-9999px; }
  button.gonder { width:100%; background:linear-gradient(135deg,var(--teal),var(--teal2)); color:#fff; border:0; border-radius:12px; padding:16px; font-size:17px; font-weight:700; margin-top:18px; cursor:pointer; box-shadow:0 8px 18px rgba(21,87,97,.25); }
  button.gonder:disabled { opacity:.5; box-shadow:none; cursor:default; }
  .hata { color:#b3261e; font-size:14.5px; margin-top:10px; }
  .tamam { text-align:center; padding:26px 16px; }
  .tik { width:68px; height:68px; margin:0 auto 10px; border-radius:50%; background:linear-gradient(135deg,#2e9e6a,#43b98a); display:flex; align-items:center; justify-content:center; color:#fff; font-size:36px; box-shadow:0 8px 18px rgba(46,158,106,.3); }
  .tamam h1 { font-size:23px; color:var(--teal); margin:6px 0; }
  .tamam .zaman { display:inline-block; background:var(--mint); color:var(--teal); font-weight:700; border-radius:999px; padding:8px 16px; margin:6px 0 10px; }
  .tamam p { color:var(--muted); font-size:15px; line-height:1.6; margin:6px 0; }
  .katalog { display:inline-block; margin-top:10px; color:var(--teal); font-weight:700; text-decoration:none; border:1.5px solid var(--teal); border-radius:10px; padding:10px 16px; }
  .yukleniyor { text-align:center; color:var(--muted); padding:30px 0; }
  footer { text-align:center; color:var(--muted); font-size:12px; padding:0 16px 30px; line-height:1.6; }
  @media (min-width:640px) { .kahraman img { height:300px; } .kahraman h1 { font-size:28px; } }
</style>
</head>
<body>
<header class="ust"><img src="/urun-gorsel/eczane-mail/lcarlie-logo-beyaz.png" alt="L’CARLIÉ"></header>
<div class="kahraman">
  <img src="/urun-gorsel/eczane-mail/eczane-ziyaret.jpg" alt="Eczanede tanışma ziyareti">
  <div class="ortu"></div>
  <div class="yazi"><span class="etiket">ECZANELERE ÖZEL</span><h1 id="baslik">15 dakikalık tanışma ziyareti</h1></div>
</div>
<main id="ana"><p class="yukleniyor">Yükleniyor…</p></main>
<footer>L’CARLIÉ Eczane İlişkileri · info@lcarlie.com.tr · 0544 544 21 15</footer>
<script>
(function () {
  var t = new URLSearchParams(location.search).get('t') || '';
  var ana = document.getElementById('ana');
  var GUN = ['Paz', 'Pzt', 'Sal', 'Çar', 'Per', 'Cum', 'Cmt'];
  var AY = ['Oca', 'Şub', 'Mar', 'Nis', 'May', 'Haz', 'Tem', 'Ağu', 'Eyl', 'Eki', 'Kas', 'Ara'];
  var GRUPLAR = ['Yüz bakımı', 'Bebek ve çocuk', 'Vücut bakımı', 'Masaj ve spor', 'Ağız bakımı', 'Ayak bakımı', 'Kadın ve erkek', 'Saç ve ev'];
  var KATALOG = 'https://www.lcarlie.shop/_files/ugd/92cdbf_9a439a7872ad438ca0e0c7f6f908fe87.pdf';
  var veri, gunSec = 0, saatSec = null, form = {};
  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
  function saatYaz(iso) { return iso.slice(11, 16); }
  function bitisYaz(iso) { var d = new Date(iso); d.setMinutes(d.getMinutes() + 30); return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0'); }
  function gunYaz(iso) { var d = new Date(iso + 'T12:00:00'); return GUN[d.getDay()] + '<b>' + d.getDate() + '</b>' + AY[d.getMonth()]; }
  function uzunYaz(iso) { var d = new Date(iso); return d.getDate() + ' ' + AY[d.getMonth()] + ' ' + GUN[d.getDay()] + ', ' + saatYaz(iso); }
  function adimlar(n) {
    return '<div class="adimlar">' + ['Gün ve saat', 'Bilgileriniz', 'Onay'].map(function (a, i) {
      return '<div class="adim' + (i + 1 === n ? ' aktif' : (i + 1 < n ? ' bitti' : '')) + '"><i>' + (i + 1 < n ? '✓' : i + 1) + '</i>' + a + '</div>';
    }).join('') + '</div>';
  }
  function giris() {
    return '<div class="giris"><p><b>L’CARLIÉ</b>, doğal ve bitkisel içeriklerle formüle edilmiş bir dermokozmetik markasıdır. ' +
      'Sekiz bakım grubundaki <b>36 ürünümüzü</b> eczanenizde, elinizde inceleyebileceğiniz kısa bir ziyaretle tanıtmak isteriz.</p>' +
      '<div class="gruplar">' + GRUPLAR.map(function (g, i) { return '<span class="grup g' + (i + 1) + '">' + g + '</span>'; }).join('') + '</div></div>' +
      '<div class="urunler"><img src="/urun-gorsel/eczane-mail/eczane-urunler.jpg" alt="LUCIDERM, HYDRAVIE, SUNACNEA SPF 30, BABYSOFT"></div>';
  }
  function formuSakla() {
    ['y', 'u', 'p', 'n'].forEach(function (k) { var el = document.getElementById(k); if (el) form[k] = el.value; });
    form.ilgi = [].slice.call(ana.querySelectorAll('.ilgi input:checked')).map(function (x) { return x.value; });
  }
  function ciz() {
    var g = veri.gunler[gunSec] || { saatler: [], yakin: [] };
    var yakin = g.yakin || [];
    ana.innerHTML = giris() + adimlar(saatSec ? 2 : 1) +
      '<div class="kart"><h2>📅 Gün ve saat seçin</h2><p class="alt">Yalnızca boş saatler görünür; seçtiğiniz saat yalnızca size ayrılır.</p><div class="gunler">' +
      veri.gunler.map(function (x, i) {
        return '<button type="button" class="gun' + (i === gunSec ? ' secili' : '') + '" data-g="' + i + '">' + gunYaz(x.gun) +
          '<span class="nokta' + ((x.yakin || []).length ? ' var' : '') + '"></span></button>';
      }).join('') +
      '</div><div class="saatler">' +
      g.saatler.map(function (s) {
        var y = yakin.indexOf(s) >= 0;
        return '<button type="button" class="saat' + (y ? ' yakin' : '') + (s === saatSec ? ' secili' : '') + '" data-s="' + s + '">' +
          saatYaz(s) + '<small>' + (y ? '📍 yakınınızdayız' : saatYaz(s) + '–' + bitisYaz(s)) + '</small></button>';
      }).join('') + '</div>' +
      (yakin.length ? '<div class="bilgi">📍 Yeşil saatlerde çevrenizde başka bir ziyaretimiz var; bu saatleri seçerseniz bize kolaylık sağlamış olursunuz.</div>' : '') +
      '</div>' +
      '<form class="kart" id="f"><h2>👤 Sizi kim karşılayacak?</h2><p class="alt">Ziyaretten önce sizi arayıp teyit edeceğiz.</p>' +
      '<label for="y">Yetkili adı soyadı *</label><input id="y" type="text" required autocomplete="name">' +
      '<label for="u">Görevi</label><select id="u"><option>Eczacı (eczane sahibi)</option><option>Mesul müdür</option><option>Yardımcı eczacı</option><option>Eczane teknikeri</option></select>' +
      '<label for="p">Telefon *</label><input id="p" type="tel" required placeholder="05xx xxx xx xx" autocomplete="tel">' +
      '<label>İlgilendiğiniz bakım grupları</label><div class="ilgi">' +
      GRUPLAR.map(function (x) { return '<label><input type="checkbox" value="' + x + '"> ' + x + '</label>'; }).join('') +
      '</div><label for="n">Eklemek istedikleriniz</label><textarea id="n" maxlength="500" placeholder="Örneğin: öğleden sonra daha uygunuz"></textarea>' +
      '<input class="bal" id="w" tabindex="-1" autocomplete="off" aria-hidden="true">' +
      '<button class="gonder" id="b" type="submit"' + (saatSec ? '' : ' disabled') + '>' + (saatSec ? esc(uzunYaz(saatSec)) + ' için randevu iste' : 'Önce bir saat seçin') + '</button>' +
      '<div class="hata" id="h"></div></form>';
    ['y', 'u', 'p', 'n'].forEach(function (k) { if (form[k] != null) document.getElementById(k).value = form[k]; });
    (form.ilgi || []).forEach(function (v) { var el = ana.querySelector('.ilgi input[value="' + v + '"]'); if (el) el.checked = true; });
    ana.querySelectorAll('.gun').forEach(function (b) { b.onclick = function () { formuSakla(); gunSec = +b.dataset.g; saatSec = null; ciz(); }; });
    ana.querySelectorAll('.saat').forEach(function (b) { b.onclick = function () { formuSakla(); saatSec = b.dataset.s; ciz(); document.getElementById('f').scrollIntoView({ behavior: 'smooth', block: 'start' }); }; });
    document.getElementById('f').onsubmit = gonder;
  }
  function tamamCiz(baslik, zaman, metin) {
    ana.innerHTML = adimlar(4) + '<div class="kart tamam"><div class="tik">✓</div><h1>' + baslik + '</h1>' +
      (zaman ? '<div class="zaman">🗓️ ' + esc(zaman) + '</div>' : '') + '<p>' + metin + '</p>' +
      '<a class="katalog" href="' + KATALOG + '" target="_blank" rel="noopener">Kataloğu inceleyin</a></div>' + giris();
  }
  function gonder(e) {
    e.preventDefault();
    var b = document.getElementById('b'), h = document.getElementById('h');
    b.disabled = true; h.textContent = '';
    formuSakla();
    fetch('/randevu/api/al', { method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ t: t, saat: saatSec, yetkili: form.y, unvan: form.u, telefon: form.p,
        ilgi: form.ilgi, not: form.n, web_sitesi: document.getElementById('w').value }) })
      .then(function (r) { return r.json().then(function (j) { return [r.status, j]; }); })
      .then(function (x) {
        if (x[0] === 200 && x[1].tamam) {
          document.getElementById('baslik').textContent = 'Görüşmek üzere!';
          tamamCiz('Randevu talebiniz alındı', uzunYaz(saatSec) + ' · ' + veri.eczane,
            'Ekibimiz ziyaretten önce sizi arayarak teyit edecek. Bu arada kataloğumuza göz atabilirsiniz.');
        } else {
          h.textContent = (x[1] && x[1].hata) || 'Bir sorun oluştu, lütfen tekrar deneyin.';
          if (x[0] === 409) { yukle(true); } else { b.disabled = false; }
        }
      })
      .catch(function () { h.textContent = 'Bağlantı sorunu. Lütfen tekrar deneyin.'; b.disabled = false; });
  }
  function yukle(formuKoru) {
    fetch('/randevu/api/bos?t=' + encodeURIComponent(t))
      .then(function (r) { return r.json().then(function (j) { return [r.status, j]; }); })
      .then(function (x) {
        if (x[0] !== 200) {
          ana.innerHTML = '<div class="kart tamam"><h1>Bağlantı geçersiz</h1><p>Randevu için 0544 544 21 15 numarasından bize ulaşabilirsiniz.</p></div>' + giris();
          return;
        }
        veri = x[1];
        document.getElementById('baslik').textContent = veri.eczane + ' için tanışma ziyareti';
        if (veri.mevcut) {
          tamamCiz('Randevunuz var', uzunYaz(veri.mevcut.baslangic) + ' · ' + veri.eczane,
            'Değişiklik için 0544 544 21 15 numarasından bize ulaşabilirsiniz.');
          return;
        }
        if (!formuKoru) { form = {}; }
        saatSec = null; gunSec = 0; ciz();
      })
      .catch(function () { ana.innerHTML = '<p class="yukleniyor">Bağlantı sorunu. Lütfen sayfayı yenileyin.</p>'; });
  }
  yukle(false);
})();
</script>
</body>
</html>
