<!doctype html>
<html data-lcarlie-theme="botanical" lang="tr"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Görsel İşleri · L’carlie</title>
<link rel="stylesheet" href="/lcarlie-theme.css?v=1">
<link rel="stylesheet" href="/image-jobs.css?v=3">
<script defer src="/lcarlie-identity.js?v=1"></script>

<main><a class="ij-geri" href="/">← L’carlie</a>
<header class="ij-bas"><div><p class="ij-ust">Kreatif stüdyo</p><h1>Ürün görsel işleri</h1>
<p class="muted">Ürün görsel paketleri burada denetlenir. Görsele tıklayınca tam boy açılır. Bu sayfa site görsellerini değiştirmez.</p></div></header>

<section class="card"><h2>Paketler</h2><div id="jobs" class="ij-isler"></div>
  <details class="ij-yukle"><summary>Yeni paket yükle</summary><input id="file" type="file" accept=".zip,application/zip"><button id="upload" type="button">Yükle ve denetle</button><p id="uploadStatus" role="status"></p></details>
</section>

<section class="card" id="detail" hidden>
  <h2 id="jobTitle"></h2><p id="jobState" class="muted"></p><p id="reports" class="ij-raporlar"></p>
  <div id="warnings" class="ij-uyarilar"></div>
  <h3>Ürünler</h3><div id="products" class="ij-urunler"></div>
  <div id="product" class="ij-urun-detay"></div>
  <details class="ij-bolum"><summary>Ekip görüşleri</summary><div id="teamNotes"></div>
    <label>Departman <select id="department"><option value="WEB">Web ve dönüşüm</option><option value="TASARIM">Tasarım ve üretim</option></select></label>
    <button id="askTeam" type="button">Bu departmana sor</button><p id="teamStatus" role="status"></p></details>
  <details class="ij-bolum"><summary>Değerlendirme yaz</summary><div id="reviews"></div>
    <select id="decision" aria-label="Karar"><option value="CHANGES_REQUIRED">Düzeltme gerekli</option><option value="APPROVE">Onay</option></select>
    <textarea id="comment" placeholder="Somut bulguyu ve gerekçeyi yazın"></textarea><button id="save" type="button">Görüşü kaydet</button><p id="reviewStatus" role="status"></p></details>
</section></main>
<script src="/display-text.js?v=6" defer></script><script src="/image-jobs.js?v=2" defer></script></html>
