name: lcarlie

services:
  postgres:
    image: postgres:17-alpine
    container_name: lcarlie-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_DB: n8n
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: Europe/Istanbul
    volumes:
      - pgdata17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [dahili]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  n8n:
    image: n8nio/n8n:${N8N_IMAGE_TAG}
    container_name: lcarlie-n8n
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      # --- veritabani ---
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      # --- kimlik / sifreleme ---
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      # --- adres / reverse proxy ---
      N8N_HOST: n8n.lcarlie.shop
      N8N_PORT: "5678"
      N8N_LISTEN_ADDRESS: 0.0.0.0
      N8N_PROTOCOL: https
      N8N_EDITOR_BASE_URL: https://n8n.lcarlie.shop/
      N8N_WEBHOOK_URL: https://n8n.lcarlie.shop/
      N8N_PROXY_HOPS: "1"
      # --- guvenlik ---
      N8N_SECURE_COOKIE: "true"
      N8N_BLOCK_ENV_ACCESS_IN_NODE: "true"
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "true"
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "true"
      N8N_HIRING_BANNER_ENABLED: "false"
      # --- calisma / bakim ---
      # Topluluk paketleri dogrulanmamis kod calistirabilir - uretimde kapali.
      N8N_UNVERIFIED_PACKAGES_ENABLED: "false"
      # Yapay zeka cagrilari uzun surebilir; varsayilan 60sn'ye dusecek, 300'de sabitliyoruz.
      N8N_RUNNERS_TASK_TIMEOUT: "300"

      # 🔴🔴 ESZAMANLILIK 1 - VERI KAYBINI DURDURAN AYAR (14.09.2026)
      #
      # SORUN: n8n her calistirmada workflow'un statik verisini veritabanindan
      # BASTAN okuyor ve calisma bitince TAMAMINI geri yaziyor (blind UPDATE,
      # kilit yok). Ayni anda iki sohbet gelirse ikincisi, birincinin kaydini
      # ve eskalasyonunu SILIYOR. Canli kanit: 30 saniyede 59 basarili sohbet
      # calismasi var, kayitlarda o pencereden TEK kayit yok.
      # Ayni sebeple hiz siniri de paralel isteklerle asilabiliyordu: oku-
      # kontrol-et-yaz uc ayri calistirmaya yayildigi icin 200 es zamanli
      # istek kovayi bos gorup geciyordu.
      #
      # 1 yapinca webhook calistirmalari SIRAYA girer; oku-degistir-yaz
      # pencereleri artik ortusmez. Slot, statik veri yazildiktan SONRA
      # birakiliyor (active-executions.js:118 .finally()).
      #
      # 🔴 KILITLENME YOK - dogrulandi: concurrency-control.service.js
      # getQueue() 'integrated' (alt workflow), 'error', 'cli', 'internal',
      # 'manual', 'retry' icin undefined doner; yalniz webhook/trigger/chat
      # slot tuketir. Yani ajan ve filtre alt workflow'lari kuyruga HIC
      # girmez, tek slotu tutan webhook kendi cocugunu bekleyemez.
      #
      # KAPASITE: sohbet calismasi ortalama 413 ms (en uzun 1.262 ms).
      # Seri tavan ~2,4/sn = ~8.700/saat. Olculen en yogun saat 323 calisma.
      # Yaklasik 27 kat pay var.
      N8N_CONCURRENCY_PRODUCTION_LIMIT: "1"

      # Tek slot varken TAKILAN bir calisma her seyi durdurur.
      # 887 calismanin hicbiri 5 sn'yi gecmedi; 60 sn fazlasiyla genis
      # ve kilitlenmeye karsi ust sinir gorevi goruyor.
      EXECUTIONS_TIMEOUT: "60"
      EXECUTIONS_TIMEOUT_MAX: "120"
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: "336"
      EXECUTIONS_DATA_PRUNE_MAX_COUNT: "50000"
      N8N_LOG_LEVEL: info
      GENERIC_TIMEZONE: Europe/Istanbul
      TZ: Europe/Istanbul
      NODE_ENV: production
    volumes:
      - n8ndata:/home/node/.n8n
      - ./files:/files
    networks: [dahili, web]
    # 5678 BILEREK host'a aciLMADI - sadece Caddy uzerinden erisilir.
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

  caddy:
    image: caddy:2-alpine
    container_name: lcarlie-caddy
    restart: unless-stopped
    depends_on: [n8n]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      TZ: Europe/Istanbul
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - /opt/lcarlie/durum:/durum:ro
      - /opt/lcarlie/widget:/widget:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [web]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }

networks:
  dahili:
    driver: bridge
    internal: true      # postgres disariya cikamaz
  web:
    driver: bridge

volumes:
  pgdata17:
  n8ndata:
  caddydata:
  caddyconfig:
