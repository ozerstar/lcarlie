# -----------------------------------------------------------------------------
# WORKFLOW TANIMLARI
#
# Alanlar (| ile ayrilir):
#   1 id                  n8n workflow ID
#   2 ad                  insan okuyacak kisa ad
#   3 kanal               whatsapp | instagram | web | -   ('-' = kanal degil)
#   4 rol                 kanal | altakis
#   5 build_betigi        kaynak klasordeki uretici
#   6 json                ureticinin yazdigi dosya adi
#   7 aktif_olmali        evet | hayir   <-- yayinlama hatti buna uyar
#   8 trafik_bekleniyor   evet | hayir
#   9 sessizlik_esigi_sa  trafik_bekleniyor=evet iken kac saat sessizlik FAILED
#                         (0 = kapali)
#
# 🔴 7. ALAN 'hayir' ISE YAYINLAMA HATTI O WORKFLOW'U AKTIF ETMEZ.
#    Onceki halinde n8n-yayinla.sh her yayinlamada BUTUN workflow'lari
#    'update:workflow --active=true' ile yayina aliyordu. Yani bir
#    sonraki yayinlama, 15.09'da bilerek kapatilan web sohbetini sessizce
#    GERI ACACAKTI - ustelik dogrulama adimi bunu "YAYINDA" diye yesil
#    gosterecegi icin kimse fark etmeyecekti.
#
# 🔴 8. ALAN 'hayir' OLMASI "saglikli" DEMEK DEGILDIR.
#    Trafik beklenmiyorsa sessizlik NO_TRAFFIC olarak raporlanir;
#    HICBIR KOSULDA HEALTHY yazilmaz. (CR-002 madde 3)
#    Meta kanallari gercek mesaj almaya basladiginda bu alan 'evet',
#    9. alan da ornegin 24 yapilmalidir.
# -----------------------------------------------------------------------------
# 🔴 MESSENGER 25.09.2026'da EKLENDI, 7. ALAN BILEREK 'hayir'.
#    Olculdu: gercek musteri trafiginin TAMAMI messenger (569 gelen /
#    1.124 giden), ama kurulu kanallar whatsapp/instagram/web idi. Yani
#    hat, trafigin olmadigi kanallarda bekliyordu.
#    26.09: kanal AKTIF edildi (7. alan 'evet') -- webhook ancak boyle
#    kaydolur ve Meta dogrulamasi yapilabilir. GONDERIM HALA KAPALI:
#    'Messenger yaniti gonder' dugumu disabled. Yani mesaj GELIR, ajan
#    karar uretir, DISARIYA HICBIR SEY CIKMAZ.
#    8. alan bilerek 'hayir': gercek trafik olculmeden 'evet' yapilirsa
#    her sakin gece sessizlik alarmi uretir.
WORKFLOWLAR_TANIM=(
  "lcarlieMevzuat01|MEVZUAT FILTRESI|-|altakis|build-workflow.js|mevzuat-workflow.json|evet|hayir|0"
  "lcarlieAkis0001|SATIS AJANI|-|altakis|build-akis-workflow.js|akis-workflow.json|evet|hayir|0"
  "lcarlieWhats001|WHATSAPP KANALI|whatsapp|kanal|build-whatsapp-workflow.js|whatsapp-workflow.json|evet|hayir|0"
  "lcarlieInsta01|INSTAGRAM KANALI|instagram|kanal|build-instagram-workflow.js|instagram-workflow.json|evet|hayir|0"
  "lcarlieMsgr001|MESSENGER KANALI|messenger|kanal|build-messenger-workflow.js|messenger-workflow.json|evet|hayir|0"
  "lcarlieSohbet01|WEB SOHBET|web|kanal|build-sohbet-workflow.js|sohbet-workflow.json|hayir|hayir|0"
)

# -----------------------------------------------------------------------------
# TEST KIMLIKLERI
#
# Bu desene uyan musteri kimlikleri URETIM KONUSMASI SAYILMAZ.
# CR-001 olcumu: statik verideki 90 kimligin 88'i test kaydiydi; durum
# sayfasi "14 konusma bekliyor" diyordu, 14'u de testti.
#
# 🔴 Desen POSIX genisletilmis duzenli ifadedir ve hem SQL (~*) hem
#    grep -E tarafindan kullanilir. Buyuk/kucuk harf duyarsiz uygulanir.
# 🔴 Desen SADECE kimligin BASINDA veya bir ayirici sonrasinda eslesir;
#    "testere" gibi gercek bir kelimeyi yanlislikla test sanmamasi icin
#    sinir karakteri sartI var.
# -----------------------------------------------------------------------------
# =============================================================================
# 🔴🔴 CR-002.5: ARTIK ANA KARAR MEKANIZMASI BU REGEX DEGIL.
#
# Siniflandirma onceligi (kimlik.js + saglik.sh):
#   1) kaydin KENDI 'traffic_class' alani      <- yeni kayitlar bunu tasir
#   2) zorunlu 'test-' oneki                   <- yeni test trafigi
#   3) kimliksiz / "-"                         -> unknown
#   4) KARANTINA dosyasi                       <- tarihsel, elle siniflanan
#   5) asagidaki eski desen                    <- YALNIZCA geriye donuk uyum
#   6) digerleri                               -> production
#
# Asagidaki liste DONDURULMUSTUR: yeni test adi eklemek icin bu listeye
# dokunmaya gerek YOK, 'test-' oneki kullanmak yeterli. Liste yalnizca
# CR-002.5 oncesinde yazilmis kayitlari dogru siniflamak icin duruyor.
# =============================================================================
TEST_ONEK="test-"
KARANTINA_DOSYA="/opt/lcarlie/karantina.conf"

# 🔴 'sinav' 15.09.2026 23:37'de EKLENDI - gercek bir kacak yakalandi.
#    Paralel bir oturum "ajan gercek soru sinavi" calistirdi ve kimlikleri
#    'sinav-0-30197' bicimindeydi. Desende olmadigi icin 12 sinav kaydi
#    URETIM KONUSMASI, 2'si de URETIM ESKALASYONU sayildi - panel gercekte
#    bekleyen musteri sayisini oldugundan fazla gosterdi.
#
# 🔴 BU DESEN BIR RED LISTESIDIR, yani her zaman GERIDEN GELIR: yeni bir
#    test kimligi bicimi ilk kullanildiginda uretim sayilir. Kalici cozum,
#    test trafiginin ayri bir kimlik onekiyle ('test-' gibi) zorunlu
#    kilinmasidir. O ayri bir CR konusu; su an desen guncelleniyor.
TEST_KIMLIK_DESENI='(^|[-_])(test|sinav|dogrulama|esk|kapi|paralel|geri-alma|geri-yukleme|uzman|filtre|hata-yolu|yayinla|duman|son-kontrol|caddy|eszamanlilik|fiyat-dogrulama|hiz-sifirla|cr002|ig-test)([-_]|$)'

