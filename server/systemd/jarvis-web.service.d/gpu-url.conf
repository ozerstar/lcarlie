# PC-2 (RTX 5060) ters tuneli 8097'de. PC-1 8098'de kalir.
#
# 🔴 24.09.2026 AKSAMI: bu kademe SAHIP KARARIYLA UYKUYA ALINDI.
# llama-server PC-2'den kaldirildi; o kutunun karti artik yalniz gorsel
# uretimine (ComfyUI) ait. Yani 8097 su anda CEVAP VERMIYOR ve bu bir
# ariza DEGIL.
#
# Ayar SILINMEDI, cunku zincirde kademe olarak durmasi bedava: sira
# [external, gpu, local] ve API ayakta oldugu surece gpu HIC yoklanmiyor
# (dongu ilk basarili kademede durur). Yalniz API dustugunde 3 saniyelik
# bir saglik yoklamasi maliyeti var -- bu, API kotasi dolduğunda calisan
# bir yedegi hazir bulundurmanin karsiligi.
#
# Geri canlandirmak icin: PC-2'ye llama-server yeniden kurulur ve
# jarvis-hakem.ps1 icinde $LlmKipiEtkin = $true yapilir.
#
# Olculdu 24.09.2026: 8097 65,3 t/s · 8098 19,2 t/s · 8099 (VDS CPU) 5,9 t/s
# API (gemini-3.5-flash-lite) 0,63 sn · 0,30/2,50 USD/1M · 7 gunde 4,46 TL
# Geri almak icin: bu dosyayi sil + systemctl daemon-reload + servisi yeniden baslat
[Service]
Environment=JARVIS_GPU_MODEL_URL=http://127.0.0.1:8098/v1
