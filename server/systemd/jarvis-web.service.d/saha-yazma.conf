# SAHA: fotograf ve harita karosu dizinlerine yazma izni.
#
# ProtectSystem=strict butun dosya sistemini salt okunur yapar; yalniz
# ReadWritePaths altindakiler yazilabilir. Bu iki dizin listede yoktu:
#   saha-foto  ziyaret fotografi kaydedilemiyordu (sahadaki kanit)
#   saha-karo  harita karosu diske yazilamiyordu, her acilista yeniden
#              indirilirdi
# Ikisi de sessizce degil hata vererek dusuyordu, ama hatayi goren kimse
# yoktu cunku ozellikler heniz hic kullanilmamisti.
[Service]
ReadWritePaths=/opt/lcarlie/saha-foto
ReadWritePaths=/opt/lcarlie/saha-karo
