<!doctype html>
<html lang="tr">
<meta charset="utf-8">
<title>KINESIS+ metin katmani</title>
<!-- Flow klipleri uzerine binecek SEFFAF metin katmani. ?b=1|2|3
     Playwright omitBackground:true ile alfa kanalli PNG olarak cekilir.
     Marka fontlari burada kullanilir; ffmpeg drawtext ile Turkce + marka
     fontu dogru cikmaz, o yuzden dizgi HTML'de yapiliyor. -->
<style>
  @font-face{font-family:Monument;src:url('https://static.wixstatic.com/ufonts/118f01_8a9435f80a7c4aa9bab563f89bea2fef/woff2/file.woff2') format('woff2');font-weight:400;font-display:block}
  @font-face{font-family:Metropolis;src:url('https://static.wixstatic.com/ufonts/027da2_9364e745b205450096a4bef333505abf/woff2/file.woff2') format('woff2');font-weight:400;font-display:block}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1080px;height:1920px;background:transparent}
  body{font-family:Metropolis,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  /* videonun uzerinde yazi okunsun diye alttan yukari koyu perde */
  .perde{position:absolute;inset:auto 0 0 0;height:900px;
    background:linear-gradient(0deg,rgba(8,20,24,.88) 0%,rgba(8,20,24,.72) 34%,rgba(8,20,24,0) 100%)}
  .bant{position:absolute;left:70px;right:70px;bottom:190px;text-align:center;color:#fff}
  .ust{font-size:27px;letter-spacing:.22em;text-transform:uppercase;
       color:rgba(255,255,255,.72);margin-bottom:24px}
  .buyuk{font-family:Monument,Metropolis,sans-serif;font-size:66px;line-height:1.14}
  .orta{font-family:Monument,Metropolis,sans-serif;font-size:46px;line-height:1.46}
  .duz{font-size:38px;line-height:1.42}
  .marka{position:absolute;top:92px;left:0;right:0;text-align:center;color:#fff;
    font-family:Monument,Metropolis,sans-serif;font-size:28px;letter-spacing:.42em;
    text-indent:.42em;text-shadow:0 2px 18px rgba(0,0,0,.55)}
</style>
<div class="perde"></div>
<div class="marka">L'CARLIÉ</div>
<div class="bant" id="bant"></div>
<script>
const b = new URLSearchParams(location.search).get('b') || '1';
const ICERIK = {
  '1': `<div class="ust">KINESIS+ formülünde</div>
        <div class="buyuk">15'ten fazla<br>bitkisel yağ</div>`,
  '2': `<div class="ust">Ve beş mineral</div>
        <div class="orta">kalsiyum · magnezyum<br>çinko · bakır · bor</div>`,
  '3': `<div class="ust">Dokusu</div>
        <div class="duz">Kolay emilen yapısı ciltte<br>yağlı bir tabaka bırakmaz.</div>`
};
document.getElementById('bant').innerHTML = ICERIK[b];
window.__hazir=false;
document.fonts.ready.then(()=>{window.__hazir=true});
</script>
